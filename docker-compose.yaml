services:
  db:
    image: postgres:16-alpine
    container_name: postgres_magicchef
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-magic_chef_ai}
    ports:
      # 5433 on the host avoids clashing with a locally installed Postgres
      - "5433:5432"
    volumes:
      # Postgres 16 cannot read data files created by Postgres 14, so it gets a fresh volume
      - postgres16-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres16-data:
