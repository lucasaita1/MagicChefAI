# Render Blueprint: API (Docker) + managed Postgres 16.
# Secrets marked sync:false are typed in the Render dashboard, never committed.
services:
  - type: web
    name: magicchef-ai-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase: { name: magicchef-ai-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: magicchef-ai-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: magicchef-ai-db, property: database }
      - key: DATABASE_USERNAME
        fromDatabase: { name: magicchef-ai-db, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: magicchef-ai-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: Strict
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: magicchef-ai-db
    databaseName: magic_chef_ai
    postgresMajorVersion: "16"
    plan: free
