spring:
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:magicchef;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  ai:
    openai:
      # Dummy key: the real OpenAI call is always replaced by a mock in tests
      api-key: test-key

magicchef:
  security:
    jwt:
      secret: test-secret-with-at-least-thirty-two-bytes!!
      ttl: 30m
    cookie:
      secure: false
    login-ip-attempts-per-minute: 15
    register-ip-attempts-per-minute: 3
    # Lets tests simulate different client IPs, like the gateway does in production
    client-ip-header: X-Real-IP
  mail:
    resend-api-key: ""
    app-base-url: https://magicchef.test
  ai:
    requests-per-minute: 3
