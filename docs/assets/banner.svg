<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="title desc">
  <title id="title">MagicChefAI</title>
  <desc id="desc">Chef robô animado do MagicChefAI: seu chef particular movido a IA generativa.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0a1d" />
      <stop offset="1" stop-color="#151133" />
    </linearGradient>
    <radialGradient id="auraViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b6cff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auraCoral" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5e7e" stop-opacity="0.38" />
      <stop offset="1" stop-color="#ff5e7e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auraMint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3cf2d0" stop-opacity="0.22" />
      <stop offset="1" stop-color="#3cf2d0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5e7e" stop-opacity="0.35" />
      <stop offset="0.5" stop-color="#8b6cff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffb347" />
      <stop offset="0.5" stop-color="#ff5e7e" />
      <stop offset="1" stop-color="#ffb347" />
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0" dur="4s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3cf2d0" />
      <stop offset="1" stop-color="#8b6cff" />
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc56e" />
      <stop offset="0.55" stop-color="#ff8a6b" />
      <stop offset="1" stop-color="#ff5e7e" />
    </linearGradient>
    <linearGradient id="apron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#d9d4f5" />
    </linearGradient>
    <radialGradient id="visor" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#2a2152" />
      <stop offset="1" stop-color="#120d29" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <clipPath id="frame"><rect width="1280" height="420" rx="28" /></clipPath>

    <!-- Ingredient bubble: line icon on a glassy circle, color via stroke -->
    <symbol id="bubble" viewBox="-30 -30 60 60" overflow="visible">
      <circle r="27" fill="#ffffff" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2" />
    </symbol>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#bg)" />

    <!-- Aurora -->
    <ellipse cx="180" cy="80" rx="320" ry="220" fill="url(#auraViolet)">
      <animate attributeName="cx" values="180;240;180" dur="18s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="1150" cy="60" rx="300" ry="200" fill="url(#auraCoral)">
      <animate attributeName="cy" values="60;110;60" dur="16s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="900" cy="440" rx="380" ry="220" fill="url(#auraMint)">
      <animate attributeName="cx" values="900;820;900" dur="20s" repeatCount="indefinite" />
    </ellipse>

    <!-- Sparkles -->
    <g fill="#ffffff">
      <path d="M560 70l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity="0.7">
        <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.2s" repeatCount="indefinite" />
      </path>
      <path d="M1210 330l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" opacity="0.6">
        <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.6s" repeatCount="indefinite" />
      </path>
      <path d="M1100 120l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" opacity="0.5">
        <animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.1s" begin="1s" repeatCount="indefinite" />
      </path>
      <circle cx="480" cy="340" r="2" opacity="0.6">
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.9s" begin="0.6s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Halo behind the robot -->
    <circle cx="285" cy="215" r="170" fill="url(#halo)">
      <animate attributeName="r" values="160;182;160" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Orbiting ingredients -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 285 215" to="360 285 215" dur="40s" repeatCount="indefinite" />
      <g transform="translate(285 40)" color="#ff6b6b">
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="40s" repeatCount="indefinite" />
          <use href="#bubble" x="-30" y="-30" width="60" height="60" />
          <g transform="translate(-12 -12)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 6c-1.5.5-2.5 2-2.5 3.5C15 15 10.5 20 4 20.5c4.5-2.5 7-6.5 7.5-11 .3-2.5 3-4.5 6-3.5z" /><path d="M17.5 6c.5-1.5 2-3 3.5-3" />
          </g>
        </g>
      </g>
      <g transform="translate(437 128)" color="#ffa94d">
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="40s" repeatCount="indefinite" />
          <use href="#bubble" x="-30" y="-30" width="60" height="60" />
          <g transform="translate(-12 -12)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21s4-1 9-6l3.5-3.5a3.5 3.5 0 0 0-5-5L7 10c-5 5-4 11-4 11z" /><path d="M10 9l1.5 1.5M7.5 13 9 14.5" /><path d="M15.5 6.5S16 3 18 2c.5 2-1 4-1 4s2-1.5 4-1c-1 2-3.5 2.5-3.5 2.5" />
          </g>
        </g>
      </g>
      <g transform="translate(437 302)" color="#ffe8a3">
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="40s" repeatCount="indefinite" />
          <use href="#bubble" x="-30" y="-30" width="60" height="60" />
          <g transform="translate(-12 -12)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22c4 0 7-3 7-7.5S15.5 2 12 2 5 10 5 14.5 8 22 12 22z" />
          </g>
        </g>
      </g>
      <g transform="translate(285 390)" color="#69db7c">
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="40s" repeatCount="indefinite" />
          <use href="#bubble" x="-30" y="-30" width="60" height="60" />
          <g transform="translate(-12 -12)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 0 1 4 13c0-6 6-10 16-10 0 10-4 17-9 17z" /><path d="M4 21c3-6 7-9 11-11" />
          </g>
        </g>
      </g>
      <g transform="translate(133 302)" color="#ffd43b">
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="40s" repeatCount="indefinite" />
          <use href="#bubble" x="-30" y="-30" width="60" height="60" />
          <g transform="translate(-12 -12)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12 15 5l6 5v9H3z" /><path d="M3 12h18" /><circle cx="8" cy="15.5" r="1.2" /><circle cx="15" cy="16" r="1.6" />
          </g>
        </g>
      </g>
      <g transform="translate(133 128)" color="#d0bfff">
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="40s" repeatCount="indefinite" />
          <use href="#bubble" x="-30" y="-30" width="60" height="60" />
          <g transform="translate(-12 -12)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 7 0 0 1 18 0z" /><path d="M9.5 12v6a2.5 2.5 0 0 0 5 0v-6" />
          </g>
        </g>
      </g>
    </g>

    <!-- Robot chef (same artwork as the app) -->
    <g transform="translate(150 60) scale(1.35)">
      <ellipse cx="100" cy="222" rx="46" ry="6" fill="#000000" fill-opacity="0.35">
        <animate attributeName="rx" values="46;38;46" dur="4.2s" repeatCount="indefinite" />
      </ellipse>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4.2s" repeatCount="indefinite" />

        <!-- Arms -->
        <g>
          <rect x="40" y="160" width="26" height="14" rx="7" fill="url(#shell)" />
          <circle cx="38" cy="167" r="9" fill="#f4f2ff" />
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 134 167;-34 134 167;-14 134 167;-34 134 167;0 134 167;0 134 167" keyTimes="0;0.15;0.3;0.45;0.6;1" dur="3.5s" repeatCount="indefinite" />
          <rect x="134" y="160" width="26" height="14" rx="7" fill="url(#shell)" />
          <circle cx="162" cy="167" r="9" fill="#f4f2ff" />
          <line x1="162" y1="164" x2="172" y2="130" stroke="#c9c4e8" stroke-width="4" stroke-linecap="round" />
          <path d="M172 130 C160 112 166 98 176 100 C186 102 186 116 172 130 Z" fill="none" stroke="#e9e6ff" stroke-width="2.2" />
          <path d="M172 130 C168 114 172 104 176 104 C180 104 180 116 172 130 Z" fill="none" stroke="#e9e6ff" stroke-width="2" />
        </g>

        <!-- Body -->
        <rect x="64" y="150" width="72" height="58" rx="22" fill="url(#apron)" />
        <path d="M78 150 L122 150 L100 172 Z" fill="#ff5e7e" />
        <circle cx="100" cy="186" r="6" fill="#3cf2d0" filter="url(#glow)">
          <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite" />
        </circle>
        <rect x="86" y="198" width="28" height="4" rx="2" fill="#c9c4e8" />

        <!-- Head -->
        <circle cx="44" cy="112" r="9" fill="#ffd08a" />
        <circle cx="44" cy="112" r="3.5" fill="#3cf2d0">
          <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite" />
        </circle>
        <circle cx="156" cy="112" r="9" fill="#ffd08a" />
        <circle cx="156" cy="112" r="3.5" fill="#3cf2d0">
          <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite" />
        </circle>
        <rect x="46" y="66" width="108" height="88" rx="32" fill="url(#shell)" />
        <path d="M62 78 Q100 62 138 78" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4" fill="none" stroke-linecap="round" />
        <rect x="58" y="84" width="84" height="50" rx="24" fill="url(#visor)" />
        <rect x="58" y="84" width="84" height="50" rx="24" fill="none" stroke="#3cf2d0" stroke-opacity="0.25" stroke-width="1.5" />

        <g filter="url(#glow)" fill="#3cf2d0">
          <ellipse cx="84" cy="106" rx="7" ry="9">
            <animate attributeName="ry" values="9;9;1;9" keyTimes="0;0.92;0.95;1" dur="4.6s" repeatCount="indefinite" />
          </ellipse>
          <ellipse cx="116" cy="106" rx="7" ry="9">
            <animate attributeName="ry" values="9;9;1;9" keyTimes="0;0.92;0.95;1" dur="4.6s" repeatCount="indefinite" />
          </ellipse>
          <!-- Talking mouth -->
          <rect x="89" y="122" width="3" height="4" rx="1.5" />
          <rect x="94" y="121" width="3" height="6" rx="1.5">
            <animate attributeName="height" values="6;10;6" dur="0.7s" repeatCount="indefinite" />
            <animate attributeName="y" values="121;119;121" dur="0.7s" repeatCount="indefinite" />
          </rect>
          <rect x="99" y="120" width="3" height="8" rx="1.5">
            <animate attributeName="height" values="8;14;8" dur="0.7s" begin="0.15s" repeatCount="indefinite" />
            <animate attributeName="y" values="120;117;120" dur="0.7s" begin="0.15s" repeatCount="indefinite" />
          </rect>
          <rect x="104" y="121" width="3" height="6" rx="1.5">
            <animate attributeName="height" values="6;10;6" dur="0.7s" begin="0.3s" repeatCount="indefinite" />
            <animate attributeName="y" values="121;119;121" dur="0.7s" begin="0.3s" repeatCount="indefinite" />
          </rect>
          <rect x="109" y="122" width="3" height="4" rx="1.5" />
        </g>
        <circle cx="64" cy="140" r="6" fill="#ff8fab" fill-opacity="0.55" />
        <circle cx="136" cy="140" r="6" fill="#ff8fab" fill-opacity="0.55" />

        <!-- Chef hat -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-2 100 66;2.5 100 66;-2 100 66" dur="4.2s" repeatCount="indefinite" />
          <circle cx="72" cy="42" r="20" fill="#ffffff" />
          <circle cx="100" cy="30" r="26" fill="#ffffff" />
          <circle cx="128" cy="42" r="20" fill="#ffffff" />
          <rect x="62" y="40" width="76" height="26" rx="6" fill="#ffffff" />
          <rect x="60" y="56" width="80" height="14" rx="6" fill="#ece9fb" />
          <circle cx="100" cy="63" r="3.5" fill="#ff5e7e" filter="url(#glow)">
            <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite" />
          </circle>
        </g>
      </g>
    </g>

    <!-- Copy -->
    <g font-family="Sora, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="560" y="118" fill="#8a84ad" font-size="17" font-weight="600" letter-spacing="4">IA GENERATIVA NA SUA COZINHA</text>
      <text x="556" y="212" font-size="96" font-weight="800" letter-spacing="-3">
        <tspan fill="#f4f2ff">Magic</tspan><tspan fill="url(#warm)">Chef</tspan><tspan fill="url(#cool)">AI</tspan>
      </text>
      <text x="560" y="262" fill="#f4f2ff" font-size="30" font-weight="600">Seu chef particular, movido a IA.</text>
      <text x="560" y="298" fill="#b9b4d6" font-size="20">Diga o que tem na geladeira e o Chef Magic cria a receita.</text>

      <!-- Typing caret -->
      <rect x="1090" y="281" width="3" height="22" rx="1.5" fill="#ff7a6b">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite" />
      </rect>

      <g font-size="15" font-weight="600">
        <rect x="560" y="330" width="136" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14" />
        <text x="628" y="352" fill="#b9b4d6" text-anchor="middle">Spring Boot 4</text>
        <rect x="706" y="330" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14" />
        <text x="762" y="352" fill="#b9b4d6" text-anchor="middle">Spring AI</text>
        <rect x="828" y="330" width="86" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14" />
        <text x="871" y="352" fill="#b9b4d6" text-anchor="middle">Vue 3</text>
        <rect x="924" y="330" width="124" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14" />
        <text x="986" y="352" fill="#b9b4d6" text-anchor="middle">Postgres 18</text>
        <rect x="1058" y="330" width="100" height="34" rx="17" fill="#ff5e7e" fill-opacity="0.12" stroke="#ff7a6b" stroke-opacity="0.5" />
        <text x="1108" y="352" fill="#ffb3a6" text-anchor="middle">OpenAI</text>
      </g>
    </g>
  </g>
</svg>
